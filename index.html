<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizer – Empfang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:     #3d6b58;
    --mid:      #5f8c76;
    --light:    #9dbdad;
    --pale:     #d4e6de;
    --cream:    #f5f2ed;
    --parchment:#eee9e0;
    --text:     #2c3e35;
    --muted:    #7a9185;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    font-family: Georgia, serif;
  }

  .wrapper {
    width: 100%;
    max-width: 620px;
    animation: fadeUp .8s ease both;
  }

  /* ── Greeting ── */
  .greeting {
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--light);
    margin-bottom: 16px;
  }

  /* ── Clock ── */
  .clock { text-align: center; margin-bottom: 44px; }

  .clock-time {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(60px, 14vw, 88px);
    font-weight: 300;
    color: var(--deep);
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .clock-time .colon {
    animation: blink 1s step-end infinite;
    opacity: .9;
  }
  .clock-time .seconds {
    font-size: .38em;
    color: var(--light);
    vertical-align: super;
    margin-left: 4px;
    font-weight: 300;
  }
  .clock-date {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Quick links ── */
  .links {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 44px;
  }
  .link-chip {
    background: #fff;
    border: 1px solid var(--pale);
    border-radius: 10px;
    padding: 9px 20px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--mid);
    display: flex;
    align-items: center;
    gap: 7px;
    transition: border-color .2s, box-shadow .2s;
  }
  .link-chip:hover {
    border-color: var(--light);
    box-shadow: 0 2px 12px #d4e6de66;
  }

  /* ── Word card ── */
  .word-card {
    background: var(--parchment);
    border-radius: 16px;
    padding: 30px 34px;
    margin-bottom: 40px;
    position: relative;
    box-shadow: 0 2px 24px #d4e6de44;
  }
  .word-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--light);
    margin-bottom: 18px;
  }
  .word-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .word-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--deep);
    line-height: 1.1;
  }
  .word-pos {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-style: italic;
    color: var(--light);
  }
  .word-origin {
    font-size: 12px;
    color: var(--light);
    letter-spacing: .5px;
    margin-bottom: 14px;
  }
  .word-meaning {
    font-size: 16px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .word-example {
    border-left: 2px solid var(--pale);
    padding-left: 16px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 15px;
    font-style: italic;
    color: var(--muted);
  }
  .word-skeleton {
    text-align: center;
    padding: 24px 0;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 1px;
    font-size: 14px;
  }
  .refresh-btn {
    position: absolute;
    top: 26px;
    right: 26px;
    background: transparent;
    border: 1px solid var(--pale);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Cormorant Garamond', Georgia, serif;
    transition: border-color .2s;
  }
  .refresh-btn:hover { border-color: var(--light); }
  .refresh-btn:disabled { opacity: .4; cursor: default; }

  /* ── Ornament ── */
  .ornament {
    text-align: center;
    font-size: 18px;
    letter-spacing: 10px;
    color: var(--pale);
  }

  /* ── Animations ── */
  @keyframes blink { 50% { opacity: .1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pulse {
    0%, 100% { opacity: .5; }
    50%       { opacity: 1; }
  }
  .loading-pulse { animation: pulse 1.4s ease infinite; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="greeting" id="greeting"></div>

  <div class="clock">
    <div class="clock-time">
      <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="seconds" id="ss">00</span>
    </div>
    <div class="clock-date" id="datestr"></div>
  </div>

  <div class="links">
    <div class="link-chip">📖 Studium</div>
    <div class="link-chip">📋 Arbeit</div>
    <div class="link-chip">🏡 Privat</div>
    <div class="link-chip">◎ Budget</div>
    <div class="link-chip">◷ Termine</div>
  </div>

  <div class="word-card">
    <div class="word-label">Fremdwort des Tages</div>
    <div id="word-body"><div class="word-skeleton loading-pulse">wird gewählt …</div></div>
    <button class="refresh-btn" id="refresh-btn" onclick="fetchWord()">↻ neu</button>
  </div>

  <div class="ornament">— ✦ —</div>

</div>

<script>
  // ── Clock ──
  const DAYS   = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

  function tick() {
    const n = new Date();
    const pad = x => String(x).padStart(2,"0");
    document.getElementById("hh").textContent = pad(n.getHours());
    document.getElementById("mm").textContent = pad(n.getMinutes());
    document.getElementById("ss").textContent = pad(n.getSeconds());
    document.getElementById("datestr").textContent =
      `${DAYS[n.getDay()]}, ${n.getDate()}. ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
    const h = n.getHours();
    document.getElementById("greeting").textContent =
      h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
  }
  tick();
  setInterval(tick, 1000);

  // ── Word of the day ──
  async function fetchWord() {
    const btn  = document.getElementById("refresh-btn");
    const body = document.getElementById("word-body");
    btn.disabled = true;
    body.innerHTML = '<div class="word-skeleton loading-pulse">wird gewählt …</div>';

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 300,
          system: `Du bist ein präziser Sprachassistent. Antworte NUR mit einem JSON-Objekt, ohne Backticks, ohne Erklärungen. Format:
{"wort":"...","wortart":"...","herkunft":"...","bedeutung":"...","beispiel":"..."}`,
          messages: [{
            role: "user",
            content: `Gib mir ein interessantes, selten verwendetes deutsches Fremdwort für heute (${new Date().toLocaleDateString("de-DE")}). Wähle etwas Bildungsnahes, Elegantes – kein Alltagswort.`
          }]
        })
      });
      const data = await res.json();
      const text = (data.content || []).find(b => b.type === "text")?.text || "";
      const w = JSON.parse(text.replace(/```json|```/g,"").trim());
      body.innerHTML = `
        <div class="word-header">
          <span class="word-title">${w.wort}</span>
          <span class="word-pos">${w.wortart}</span>
        </div>
        <div class="word-origin">${w.herkunft}</div>
        <div class="word-meaning">${w.bedeutung}</div>
        <div class="word-example">» ${w.beispiel} «</div>`;
    } catch {
      body.innerHTML = `
        <div class="word-header">
          <span class="word-title">Serendipität</span>
          <span class="word-pos">Substantiv</span>
        </div>
        <div class="word-origin">Englisch (Horace Walpole, 1754)</div>
        <div class="word-meaning">Das glückliche Entdecken von etwas Wertvollem, das man nicht gesucht hat.</div>
        <div class="word-example">» Die Serendipität führte sie zu ihrer wichtigsten Erkenntnis. «</div>`;
    }
    btn.disabled = false;
  }

  fetchWord();
</script>
</body>
</html>
